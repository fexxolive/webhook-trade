name: Ping Webhook Health

"on":
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit /health
        run: |
          curl -sS -m 10 \
            -o /dev/null \
            -w "health_status=%{http_code}\n" \
            https://webhook-trade-a1vh.onrender.com/health

      - name: Hit /webhook PING
        run: |
          curl -sS -m 10 \
            -H "Content-Type: application/json" \
            -d '{"event":"PING"}' \
            https://webhook-trade-a1vh.onrender.com/webhook
