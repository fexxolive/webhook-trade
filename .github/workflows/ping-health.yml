name: Ping Webhook Health

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (UTC)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # ----------- 1) HIT /health -----------
      - name: Hit /health
        run: |
          curl -sS -m 10 \
          -o /dev/null \
          -w "health_status=%{http_code}\n" \
          https://webhook-relay-zip.onrender.com/health

      # ----------- 2) HIT /webhook (PING) -----------
      - name: Hit /webhook (PING)
        run: |
          curl -sS -m 10 \
          -H "Content-Type: application/json" \
          -d '{"event":"PING"}' \
          https://webhook-relay-zip.onrender.com/webhook
